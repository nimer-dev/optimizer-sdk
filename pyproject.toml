[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nimer"
dynamic = ["version"]
description = "Cut your Claude API costs by 60% with intelligent model routing."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Nimer", email = "hello@nimer.dev" },
]
keywords = ["anthropic", "claude", "llm", "cost-optimization", "routing", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "anthropic>=0.40.0",
  "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.1.0",
  "mypy>=1.0",
]

[project.urls]
Homepage = "https://nimer.dev"
Documentation = "https://nimer.dev/docs"
Repository = "https://github.com/nimer-dev/optimizer-sdk"
Issues = "https://github.com/nimer-dev/optimizer-sdk/issues"

[tool.hatch.version]
path = "nimer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["nimer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
